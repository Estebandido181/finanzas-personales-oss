# Configuración del comando "alembic" para desarrollo (ítem 22).
#
# No lleva ninguna ruta de base ni credencial: env.py usa la variable DB_PATH.
# Para aplicar migraciones usa "python -m finanzas.migrar" (hace el respaldo
# previo); este archivo sirve para, por ejemplo:
#
#   DB_PATH=copia.db alembic check
#   DB_PATH=copia.db alembic revision --autogenerate -m "descripción"

[alembic]
script_location = %(here)s/backend/finanzas/migraciones
prepend_sys_path = backend
path_separator = os
file_template = %%(rev)s_%%(slug)s
