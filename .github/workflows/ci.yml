name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints-linux-py312.txt
      - run: pip install -c backend/constraints-linux-py312.txt -r backend/requirements-dev.txt -e .
      - run: python scripts/revisar_fronteras.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -c ../backend/constraints-linux-py312.txt -r ../backend/requirements-dev.txt -e ..
      - run: npm ci --ignore-scripts
      - name: Generated API types match the checked-in contract
        run: |
          npm run tipos
          git diff --exit-code -- src/api/esquema.d.ts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run e2e
        env:
          PYTHON: python

  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Public checks use only generic rules. No private denylist is exposed to PR code.
    env:
      DATOS_PROHIBIDOS: ""
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generic privacy checks (no repository secrets)
        run: |
          python scripts/revisar_datos.py --todo
          if [ -n "$BASE_SHA" ]; then
            python scripts/revisar_datos.py --base "$BASE_SHA"
          fi
