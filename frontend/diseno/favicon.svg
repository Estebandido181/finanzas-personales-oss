<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon D28 «Libro mayor, noche petróleo»: una hoja de libro mayor (papel
       sobre papel, sin borde de tinta ni sombra sólida), doble raya roja del
       margen y renglones. Colores de tokens.css (card, foreground, destructive).
       Se adapta al modo oscuro del sistema. Sin texto: a 16 px no se leería. -->
  <defs>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <style>
    .papel { fill: #F5EDDB; stroke: #33241A; stroke-opacity: .3; }
    .tinta { stroke: #33241A; }
    .margen { stroke: #983224; }
    .sombra { fill: #4A3223; opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .papel { fill: #22312E; stroke: #F0E8D8; stroke-opacity: .3; }
      .tinta { stroke: #F0E8D8; }
      .margen { stroke: #F0A08C; }
      .sombra { fill: #000; opacity: .6; }
    }
  </style>
  <rect class="sombra" x="5" y="6.5" width="22" height="24" rx="2" filter="url(#sombra)"/>
  <rect class="papel" x="4.5" y="3.5" width="23" height="25" rx="2" stroke-width="1"/>
  <g class="margen" stroke-width="1.1">
    <line x1="10" y1="4.5" x2="10" y2="27.5"/>
    <line x1="12" y1="4.5" x2="12" y2="27.5"/>
  </g>
  <g class="tinta" stroke-width="1.8" stroke-linecap="round">
    <line x1="15.5" y1="10" x2="24" y2="10"/>
    <line x1="15.5" y1="15.5" x2="24" y2="15.5"/>
    <line x1="15.5" y1="21" x2="21" y2="21"/>
  </g>
</svg>
