<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Finanzas personales (prototipo)</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="componentes.css">
  <script src="tema.js"></script>
</head>
<body>
<main class="login">
  <div class="hoja">
    <div class="login__marca">
      <img src="../favicon.svg" alt="">
      <h1>Finanzas personales</h1>
      <p class="ayuda">Tus cuentas del mes, al día y sin anotar nada a mano.</p>
    </div>
    <form class="formulario" action="inicio.html">
      <div class="campo">
        <label class="etiqueta" for="contrasena">Contraseña</label>
        <input class="entrada" id="contrasena" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="boton boton--principal boton--ancho">Entrar</button>
    </form>
  </div>
</main>
</body>
</html>
